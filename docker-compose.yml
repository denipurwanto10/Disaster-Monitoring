services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-disaster_monitoring}
      MYSQL_USER: ${DB_USER:-dm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dm_pass}
    ports:
      - "${DB_PORT_MAPPED:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-dm_user}
      DB_PASSWORD: ${DB_PASSWORD:-dm_pass}
      DB_NAME: ${DB_NAME:-disaster_monitoring}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-60000}
    ports:
      - "${BACKEND_PORT_MAPPED:-4000}:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT_MAPPED:-3000}:3000"

volumes:
  db_data:
